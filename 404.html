<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<script>
  // A missing path inside a folder (for example /harmony/typo) goes back to that
  // folder's own front page. A missing top-level page is an old bookmark from the
  // quiz pages that used to live here, so it is forwarded to the same path on
  // their current domain (every known old path also has its own redirect file).
  (function () {
    var p = location.pathname;
    var m = p.match(/^\/([^\/]+)\//);
    if (m) { location.replace("/" + m[1] + "/"); return; }
    if (/^\/[^\/]+\.html$/.test(p)) {
      location.replace("https://redsealquiz.ca" + p + location.search);
    }
  })();
</script>
<style>
  body{margin:0;background:#f6f6f4;color:#1a3a5c;line-height:1.6;
       font-family:"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
  @media (prefers-color-scheme:dark){body{background:#16181b;color:#e8edf2}}
  main{max-width:560px;margin:0 auto;padding:34px 20px}
  h1{font-size:1.2rem;margin:0 0 8px}
  p{color:#646f70;font-size:.9rem;margin:0}
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The address may have changed. Please check the link you followed.</p>
  </main>
</body>
</html>
